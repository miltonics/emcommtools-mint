---
# roles/voacap/tasks/main.yml

- name: Install VOACAP dependencies
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-tk
      - tk-dev
    state: present
  tags: [voacap]

- name: Install VOACAP Python package
  ansible.builtin.pip:
    name: voacapy
    state: present
    executable: pip3
  tags: [voacap]

- name: Install et-voacap wrapper
  ansible.builtin.copy:
    dest: "{{ hamradio_bin_dir }}/et-voacap"
    content: |
      #!/bin/bash
      # et-voacap — VOACAP propagation prediction wrapper
      # Usage: et-voacap [options]
      # Reads callsign and gridsquare from /etc/hamradio/state
      source {{ hamradio_etc_dir }}/state
      exec python3 -m voacapy \
        --tx-grid "${GRIDSQUARE}" \
        --callsign "${CALLSIGN}" \
        "$@"
    owner: root
    group: root
    mode: "0755"
  tags: [voacap]
