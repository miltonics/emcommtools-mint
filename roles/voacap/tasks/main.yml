---
# roles/voacap/tasks/main.yml
# voacapl: built from source - not available as apt package on Mint 22
# Source: https://github.com/jawatson/voacapl
- name: Install voacapl build dependencies
  ansible.builtin.apt:
    name:
      - gfortran
      - automake
      - autoconf
      - python3-matplotlib
      - python3-cartopy
      - python3-scipy
    state: present
  tags: [voacap]

- name: Check if voacapl already installed
  ansible.builtin.stat:
    path: /usr/local/bin/voacapl
  register: voacapl_bin
  tags: [voacap]

- name: Clone voacapl source
  ansible.builtin.git:
    repo: https://github.com/jawatson/voacapl.git
    dest: /tmp/voacapl-src
    depth: 1
  when: not voacapl_bin.stat.exists
  tags: [voacap]

- name: Build and install voacapl
  ansible.builtin.shell: |
    cd /tmp/voacapl-src
    autoreconf --install
    ./configure
    make
    make install
  args:
    creates: /usr/local/bin/voacapl
  tags: [voacap]

- name: Run makeitshfbc for radio user
  ansible.builtin.command:
    cmd: makeitshfbc
    creates: "{{ radio_user_home }}/itshfbc"
  become: true
  become_user: "{{ radio_user }}"
  tags: [voacap]
