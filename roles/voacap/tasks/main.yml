---
# roles/voacap/tasks/main.yml
- name: Install VOACAP dependencies
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-tk
      - python3-venv
      - tk-dev
    state: present
  tags: [voacap]

- name: Create VOACAP virtualenv and install voacapy
  ansible.builtin.pip:
    name: voacapy
    state: present
    virtualenv: /opt/voacap-venv
    virtualenv_command: python3 -m venv
  tags: [voacap]

- name: Install et-voacap wrapper
  ansible.builtin.copy:
    dest: "{{ hamradio_bin_dir }}/et-voacap"
    content: |
      #!/bin/bash
      # et-voacap — VOACAP propagation prediction wrapper
      # Usage: et-voacap [options]
      # Reads callsign and gridsquare from /etc/hamradio/state
      source {{ hamradio_etc_dir }}/state
      exec /opt/voacap-venv/bin/python -m voacapy \
        --tx-grid "${GRIDSQUARE}" \
        --callsign "${CALLSIGN}" \
        "$@"
    owner: root
    group: root
    mode: "0755"
  tags: [voacap]
