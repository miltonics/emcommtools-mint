---
# roles/voacap/tasks/main.yml
# voacapl: Linux port of VOACAP HF propagation prediction engine
# pythonprop: GUI wrapper (voacapgui command)
- name: Install voacapl and pythonprop dependencies
  ansible.builtin.apt:
    name:
      - voacapl
      - python3-matplotlib
      - python3-cartopy
      - python3-scipy
    state: present
  tags: [voacap]

- name: Note about VOACAP GUI
  ansible.builtin.debug:
    msg: >
      VOACAP installed as voacapl (command line) with python3 dependencies.
      For the GUI, install pythonprop from https://github.com/jawatson/pythonprop
      and run 'voacapgui' from the terminal.
  tags: [voacap]
