---
# roles/ardop/tasks/main.yml

- name: Install ARDOP audio dependencies
  ansible.builtin.apt:
    name:
      - libhamlib-dev
      - portaudio19-dev
    state: present
  tags: [ardop]

- name: Check if ardopcf binary already installed
  ansible.builtin.stat:
    path: /usr/local/bin/ardopc
  register: ardopc_stat
  tags: [ardop]

- name: Get latest ardopcf release info
  ansible.builtin.uri:
    url: https://api.github.com/repos/pflarue/ardop/releases/latest
    return_content: true
    headers:
      Accept: "application/vnd.github.v3+json"
  register: ardopcf_release
  when: not ardopc_stat.stat.exists
  tags: [ardop]

- name: Set ardopcf download URL
  ansible.builtin.set_fact:
    ardopcf_url: >-
      {{ ardopcf_release.json.assets
         | selectattr('name', 'match', '.*amd64_Linux.*')
         | map(attribute='browser_download_url')
         | first }}
  when: not ardopc_stat.stat.exists
  tags: [ardop]

- name: Download ardopcf binary
  ansible.builtin.get_url:
    url: "{{ ardopcf_url }}"
    dest: /usr/local/bin/ardopc
    mode: "0755"
    owner: root
    group: root
  when: not ardopc_stat.stat.exists
  tags: [ardop]

- name: Install ardopc systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/ardopc.service
    content: |
      [Unit]
      Description=ARDOP HF modem (ardopcf)
      After=sound.target

      [Service]
      Type=simple
      User={{ radio_user }}
      EnvironmentFile={{ hamradio_etc_dir }}/state
      ExecStart=/usr/local/bin/ardopc 8515 ${RADIO_AUDIO_CAPTURE} ${RADIO_AUDIO}
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [ardop]

- name: Write ARDOP notes
  ansible.builtin.copy:
    dest: "{{ hamradio_lib_dir }}/ARDOP_NOTES.md"
    content: |
      # ARDOP Notes
      Using ardopcf (pflarue/ardop fork) — includes improvements over original ardopc.
      If you experience audio underruns try:
        echo 'vm.swappiness=10' | sudo tee /etc/sysctl.d/99-hamradio.conf
        sudo sysctl -p /etc/sysctl.d/99-hamradio.conf
    force: false
  tags: [ardop]
