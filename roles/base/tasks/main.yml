---
# roles/base/tasks/main.yml
# System foundation: update, common packages, user groups, udev prereqs

- name: Detect Linux Mint / Ubuntu base
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] in ["Linux Mint", "Ubuntu", "Linuxmint"]
    fail_msg: >
      This playbook targets Linux Mint or Ubuntu.
      Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}
  tags: [base]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [base]

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
  tags: [base]

- name: Install common build and utility dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - build-essential
      - cmake
      - pkg-config
      - python3
      - python3-pip
      - python3-venv
      - python3-serial
      - socat
      - usbutils
      - net-tools
      - jq
      - unzip
      - tar
      - gzip
      - bc
      - dialog
      - whiptail
      - chrony
      - gpsd
      - gpsd-clients
      - libgps-dev
      - conky-all
      - xterm
    state: present
  tags: [base]

- name: Create hamradio configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ hamradio_etc_dir }}"
    - "{{ hamradio_lib_dir }}"
    - "{{ hamradio_log_dir }}"
  tags: [base]

- name: Add radio user to required groups
  ansible.builtin.user:
    name: "{{ radio_user }}"
    groups: "{{ item }}"
    append: true
  loop:
    - dialout      # serial/USB serial ports
    - audio        # audio devices
    - plugdev      # USB hotplug
    - sudo         # keep existing sudo access
  tags: [base]

- name: Install udev rules for common ham radio USB IDs
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-hamradio.rules
    content: |
      # Ham Radio USB udev rules
      # Generated by hamradio-mint-setup

      # DigiRig Mobile (CP2102)
      SUBSYSTEM=="tty", ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea60", \
        SYMLINK+="ttyDIGIRIG", MODE="0666", GROUP="dialout"

      # CH340/CH341 (used by (tr)uSDX, many cheap adapters)
      SUBSYSTEM=="tty", ATTRS{idVendor}=="1a86", ATTRS{idProduct}=="7523", \
        SYMLINK+="ttyTRUSDX", MODE="0666", GROUP="dialout"
      SUBSYSTEM=="tty", ATTRS{idVendor}=="1a86", ATTRS{idProduct}=="55d4", \
        SYMLINK+="ttyTRUSDX", MODE="0666", GROUP="dialout"

      # FTDI (FT232, used by many Yaesu/Icom radios)
      SUBSYSTEM=="tty", ATTRS{idVendor}=="0403", ATTRS{idProduct}=="6001", \
        MODE="0666", GROUP="dialout"
      SUBSYSTEM=="tty", ATTRS{idVendor}=="0403", ATTRS{idProduct}=="6015", \
        MODE="0666", GROUP="dialout"

      # Icom IC-705 / IC-7100 (Silicon Labs)
      SUBSYSTEM=="tty", ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea70", \
        MODE="0666", GROUP="dialout"

      # Prolific PL2303 (older cables)
      SUBSYSTEM=="tty", ATTRS{idVendor}=="067b", ATTRS{idProduct}=="2303", \
        MODE="0666", GROUP="dialout"

      # RTL-SDR
      SUBSYSTEM=="usb", ATTRS{idVendor}=="0bda", ATTRS{idProduct}=="2838", \
        MODE="0666", GROUP="plugdev"
      SUBSYSTEM=="usb", ATTRS{idVendor}=="0bda", ATTRS{idProduct}=="2832", \
        MODE="0666", GROUP="plugdev"
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev
  tags: [base]

- name: Reload udev rules now
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: false
  tags: [base]

- name: Create hamradio state file (et-user populates identity fields)
  ansible.builtin.copy:
    dest: "{{ hamradio_etc_dir }}/state"
    content: |
      # /etc/hamradio/state — written by et-user, et-radio, et-mode
      # Run 'et-user' to set callsign, grid, name, and Winlink password.
      CALLSIGN=
      GRIDSQUARE=
      OPERATOR_NAME=
      WINLINK_PASSWORD=
      RADIO=none
      RADIO_PORT=none
      RADIO_MODEL=none
      RADIO_BAUD=none
      RADIO_AUDIO=none
      RADIO_AUDIO_CAPTURE=none
      RADIO_AUDIO_PW=none
      RADIO_AUDIO_CAPTURE_PW=none
      MODE=none
    force: false   # don't overwrite if already customised
    owner: root
    group: "{{ radio_user }}"
    mode: "0664"
  tags: [base]
