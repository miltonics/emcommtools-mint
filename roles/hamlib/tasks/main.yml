---
# roles/hamlib/tasks/main.yml
- name: Install Hamlib
  ansible.builtin.apt:
    name:
      - libhamlib-dev
      - libhamlib-utils
      - python3-hamlib
    state: present
  tags: [hamlib]

- name: Install rigctld systemd service template
  ansible.builtin.template:
    src: rigctld@.service.j2
    dest: /etc/systemd/system/rigctld@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [hamlib]

- name: Create rigctld environment file
  ansible.builtin.copy:
    dest: /etc/hamradio/rigctld.env
    content: |
      RADIO_PORT=/dev/ttyACM0
      RADIO_BAUD=115200
    owner: root
    group: root
    mode: "0644"
    force: false
  tags: [hamlib]

- name: Verify rigctld is available
  ansible.builtin.command: which rigctld
  register: rigctld_path
  changed_when: false
  failed_when: rigctld_path.rc != 0
  tags: [hamlib]
