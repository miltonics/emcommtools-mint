---
# roles/hamlib/tasks/main.yml
- name: Install Hamlib
  ansible.builtin.apt:
    name:
      - libhamlib-dev
      - libhamlib-utils
      - python3-hamlib
    state: present
  tags: [hamlib]

- name: Install rigctld systemd service template
  ansible.builtin.copy:
    dest: /etc/systemd/system/rigctld@.service
    content: |
      # rigctld@.service — parameterised rigctld instance
      [Unit]
      Description=Hamlib rig control daemon (model %i)
      After=network.target
      [Service]
      Type=simple
      EnvironmentFile=/etc/hamradio/rigctld.env
      ExecStart=/bin/bash -c "/usr/bin/rigctld --model=%i --rig-file=$RADIO_PORT --serial-speed=$RADIO_BAUD --listen-addr=127.0.0.1 --port=4532"
      Restart=on-failure
      RestartSec=3
      User={{ radio_user }}
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [hamlib]

- name: Create rigctld environment file
  ansible.builtin.copy:
    dest: /etc/hamradio/rigctld.env
    content: |
      RADIO_PORT=/dev/ttyACM0
      RADIO_BAUD=115200
    owner: root
    group: root
    mode: "0644"
    force: false
  tags: [hamlib]

- name: Verify rigctld is available
  ansible.builtin.command: which rigctld
  register: rigctld_path
  changed_when: false
  failed_when: rigctld_path.rc != 0
  tags: [hamlib]
