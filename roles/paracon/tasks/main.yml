---
# roles/paracon/tasks/main.yml
# Paracon: packet radio terminal (BBS client) by Martin Cooper KD6YAM.
# A self-contained Python zipapp. It talks AGWPE, so it reaches the radio
# through LinBPQ (UV-PRO path) or Direwolf (sound card path). et-paracon
# sets that up and starts it.
# Repo: https://github.com/mfncooper/paracon

- name: Install Python for Paracon
  ansible.builtin.apt:
    name: python3
    state: present
  tags: [paracon]

- name: Check installed Paracon version
  ansible.builtin.command: "python3 {{ hamradio_bin_dir }}/paracon --version"
  register: paracon_installed
  changed_when: false
  failed_when: false
  tags: [paracon]

- name: Download Paracon {{ paracon_version }}
  ansible.builtin.get_url:
    url: "https://github.com/mfncooper/paracon/releases/download/v{{ paracon_version }}/paracon_{{ paracon_version }}.pyz"
    dest: "{{ hamradio_bin_dir }}/paracon"
    mode: "0755"
    owner: root
    group: root
    force: true
  when: paracon_version not in (paracon_installed.stdout | default('') ~ paracon_installed.stderr | default(''))
  tags: [paracon]

- name: Install et-paracon (point Paracon at the radio and start it)
  ansible.builtin.template:
    src: et-paracon.j2
    dest: "{{ hamradio_bin_dir }}/et-paracon"
    owner: root
    group: root
    mode: "0755"
  tags: [paracon]

- name: Create Paracon config directory
  ansible.builtin.file:
    path: "{{ radio_user_home }}/.config/paracon"
    state: directory
    owner: "{{ radio_user }}"
    group: "{{ radio_user }}"
    mode: "0755"
  tags: [paracon]

- name: Remove the unused config left by older versions of this role
  ansible.builtin.file:
    path: "{{ radio_user_home }}/.config/paracon/paracon.ini"
    state: absent
  tags: [paracon]

- name: Write a starting Paracon config
  ansible.builtin.copy:
    dest: "{{ radio_user_home }}/.config/paracon/paracon.cfg"
    content: |
      [Setup]
      host = localhost
      port = 8000
      callsign = N0CALL
    owner: "{{ radio_user }}"
    group: "{{ radio_user }}"
    mode: "0644"
    force: false
  tags: [paracon]

- name: Add "Packet BBS client (Paracon)" to the app menu
  ansible.builtin.copy:
    dest: /usr/share/applications/et-paracon.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Name=Packet BBS client (Paracon)
      Comment=Connect to packet nodes and BBSs
      Exec=et-paracon
      Icon=utilities-terminal
      Terminal=true
      Categories=HamRadio;Network;
    owner: root
    group: root
    mode: "0644"
  tags: [paracon]
