---
# roles/sdrpp/tasks/main.yml

- name: Install RTL-SDR kernel driver blacklist (prevent kernel grabbing device)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/rtl-sdr-blacklist.conf
    content: |
      blacklist dvb_usb_rtl28xxu
      blacklist rtl2832
      blacklist rtl2830
    owner: root
    group: root
    mode: "0644"
  tags: [sdrpp]

- name: Install SDR++ dependencies
  ansible.builtin.apt:
    name:
      - librtlsdr-dev
      - rtl-sdr
      - libfftw3-dev
    state: present
  tags: [sdrpp]

- name: Check if SDR++ already installed
  ansible.builtin.stat:
    path: /usr/bin/sdrpp
  register: sdrpp_bin
  when: sdrpp_install_method == "ppa"
  tags: [sdrpp]

- name: Download SDR++ deb (Ubuntu Noble / Mint 22)
  ansible.builtin.get_url:
    url: "https://github.com/AlexandreRouma/SDRPlusPlus/releases/latest/download/sdrpp_ubuntu_noble_amd64.deb"
    dest: /tmp/sdrpp.deb
    mode: "0644"
  when:
    - sdrpp_install_method == "ppa"
    - not sdrpp_bin.stat.exists
  tags: [sdrpp]

- name: Install SDR++ deb
  ansible.builtin.apt:
    deb: /tmp/sdrpp.deb
    state: present
  when:
    - sdrpp_install_method == "ppa"
    - not sdrpp_bin.stat.exists
  tags: [sdrpp]

- name: Note about SDR++ build method
  ansible.builtin.debug:
    msg: >
      sdrpp_install_method is set to 'build'. Manual build steps are
      documented in docs/BUILDING_SDRPP.md. Set sdrpp_install_method: ppa
      in group_vars/all.yml to use the PPA instead.
  when: sdrpp_install_method == "build"
  tags: [sdrpp]
