-- hamradio.conf — emcommtools-mint status widget for Cinnamon/Mint
-- Reads /etc/hamradio/state and shows live system status
-- Place at: ~/.config/conky/hamradio.conf

conky.config = {
    -- Position: top-right corner
    alignment = 'top_right',
    gap_x = 16,
    gap_y = 48,
    
    -- Window behaviour
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 200,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Size
    minimum_width = 360,
    maximum_width = 360,
    
    -- Update
    update_interval = 5,
    
    -- Fonts
    use_xft = true,
    font = 'DejaVu Sans Mono:size=11',
    
    -- Colors
    default_color = 'white',
    color1 = '00CC44',   -- green  (ok)
    color2 = 'FF6600',   -- orange (warn)
    color3 = 'FF3333',   -- red    (error)
    color4 = '88CCFF',   -- blue   (label)
    color5 = 'FFDD00',   -- yellow (callsign)
    
    -- Background
    background = false,
    
    -- Borders
    draw_borders = false,
    stippled_borders = 0,
    border_width = 1,
    
    double_buffer = true,
    no_buffers = true,
    draw_shades = false,
    draw_outline = false,
}

conky.text = [[
${color4}┌─ HAM RADIO STATION ─────────────────┐${color}
${color4}│${color} ${color5}${execi 10 grep "^CALLSIGN=" /etc/hamradio/state 2>/dev/null | cut -d= -f2}${color}  ${execi 10 grep "^GRIDSQUARE=" /etc/hamradio/state 2>/dev/null | cut -d= -f2}  ${execi 10 grep "^OPERATOR_NAME=" /etc/hamradio/state 2>/dev/null | cut -d= -f2}
${color4}├─ RADIO ──────────────────────────────┤${color}
${color4}│${color} ${execi 10 grep "^RADIO=" /etc/hamradio/state 2>/dev/null | cut -d= -f2 | cut -c1-34}
${color4}│${color} Port: ${execi 10 grep "^RADIO_PORT=" /etc/hamradio/state 2>/dev/null | cut -d= -f2}
${color4}│${color} Baud: ${execi 10 grep "^RADIO_BAUD=" /etc/hamradio/state 2>/dev/null | cut -d= -f2}   Mode: ${execi 10 grep "^MODE=" /etc/hamradio/state 2>/dev/null | cut -d= -f2}
${color4}├─ AUDIO ──────────────────────────────┤${color}
${color4}│${color} TX: ${execi 10 grep "^RADIO_AUDIO=" /etc/hamradio/state 2>/dev/null | cut -d= -f2}
${color4}│${color} RX: ${execi 10 grep "^RADIO_AUDIO_CAPTURE=" /etc/hamradio/state 2>/dev/null | cut -d= -f2}
${color4}├─ SERVICES ───────────────────────────┤${color}
${color4}│${color} rigctld  ${execi 5 M=$(grep "^RADIO_MODEL=" /etc/hamradio/state 2>/dev/null | cut -d= -f2 | tr -d ' '); [ "$M" = "1" ] && echo "n/a" || systemctl is-active "rigctld@${M}" 2>/dev/null || echo "?"}
${color4}│${color} direwolf ${execi 5 systemctl is-active direwolf 2>/dev/null}
${color4}│${color} ardop    ${execi 5 systemctl is-active ardopc 2>/dev/null}
${color4}│${color} linbpq   ${execi 5 systemctl is-active linbpq 2>/dev/null}
${color4}├─ SYSTEM ─────────────────────────────┤${color}
${color4}│${color} ${time %Y-%m-%d %H:%M:%S UTC%z}
${color4}│${color} Up: ${uptime_short}   CPU: ${cpu}%   Mem: ${memperc}%
${color4}│${color} ${execi 30 ip route get 1.1.1.1 2>/dev/null | awk '{print $7}' | head -1 | sed 's/^/IP: /'}
${color4}└──────────────────────────────────────┘${color}
]]
