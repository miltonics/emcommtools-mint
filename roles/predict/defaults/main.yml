---
# roles/predict/defaults/main.yml
# et-predict: offline HF propagation prediction (EmComm Tools et-predict-app)
#
# How the pieces connect:
#   et-predict-app (map GUI)
#     -> et-api (local web service on port 1981, from the etapi role)
#       -> /opt/emcomm-tools/bin/et-voacap (script)
#         -> voacapl (the VOACAP engine, built by the voacap role)
#
# Versions match EmComm Tools Community R6.

et_predict_app_version: "1.5.2"
et_predict_app_url: "https://github.com/thetechprepper/et-predict-app/releases/download/{{ et_predict_app_version }}/et-predict-app_{{ et_predict_app_version }}_amd64.deb"

etc_voacap_dir: "{{ radio_user_home }}/.local/share/emcomm-tools/voacap"
