---
# roles/wsjtx/tasks/main.yml

- name: Install WSJT-X from apt
  ansible.builtin.apt:
    name: wsjtx
    state: present
  tags: [wsjtx]

- name: Create WSJT-X config directory for user
  ansible.builtin.file:
    path: "{{ radio_user_home }}/.config/WSJT-X"
    state: directory
    owner: "{{ radio_user }}"
    group: "{{ radio_user }}"
    mode: "0755"
  tags: [wsjtx]

- name: Write WSJT-X baseline config (callsign, grid, CAT)
  ansible.builtin.template:
    src: WSJT-X.ini.j2
    dest: "{{ radio_user_home }}/.config/WSJT-X/WSJT-X.ini"
    owner: "{{ radio_user }}"
    group: "{{ radio_user }}"
    mode: "0644"
    force: false   # don't overwrite user customisations on re-runs
  tags: [wsjtx]
